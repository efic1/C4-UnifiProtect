name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and zip
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip

      - name: Gates, tests and package
        run: tools/build.sh

      - name: Upload drivers
        uses: actions/upload-artifact@v4
        with:
          name: drivers
          path: dist/*.c4z

      - name: Attach drivers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.c4z
